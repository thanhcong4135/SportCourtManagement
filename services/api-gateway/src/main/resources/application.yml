spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${APP_SECURITY_CORS_ALLOWED_ORIGIN:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - X-Trace-Id
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: auth-service
          uri: ${app.downstream.auth-service-url:http://localhost:8082}
          predicates:
            - Path=/api/auth/**
        - id: core-service
          uri: ${app.downstream.core-service-url:http://localhost:8081}
          predicates:
            - Path=/api/core/**
        - id: payment-service
          uri: ${app.downstream.payment-service-url:http://localhost:8083}
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: ${app.downstream.notification-service-url:http://localhost:8084}
          predicates:
            - Path=/api/notifications/**
        - id: reporting-service
          uri: ${app.downstream.reporting-service-url:http://localhost:8085}
          predicates:
            - Path=/api/reports/**
        - id: chatbot-service
          uri: ${app.downstream.chatbot-service-url:http://localhost:8086}
          predicates:
            - Path=/api/chatbot/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

app:
  security:
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGIN:http://localhost:5173}
    jwt:
      issuer-uri: ${APP_SECURITY_JWT_ISSUER:https://auth.sportcourt.local}
      jwk-set-uri: ${APP_SECURITY_JWT_JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
