spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:mysql://localhost:${REPORTING_DB_PORT:3310}/reporting_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${kafka.bootstrap-servers}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

kafka:
  bootstrap-servers: localhost:9092
  topics:
    booking-events: booking.events
    payment-events: payment.events
    sales-events: sales.events
  consumer:
    booking:
      enabled: true
      group-id: reporting-service-booking
    payment:
      enabled: true
      group-id: reporting-service-payment
    sales:
      enabled: true
      group-id: reporting-service-sales
