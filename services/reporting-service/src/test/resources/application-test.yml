spring:
  datasource:
    url: jdbc:h2:mem:reporting_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

kafka:
  consumer:
    booking:
      enabled: false
    payment:
      enabled: false
    sales:
      enabled: false
