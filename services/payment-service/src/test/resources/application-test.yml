spring:
  datasource:
    url: jdbc:h2:mem:payment_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  kafka:
    consumer:
      auto-offset-reset: earliest

app:
  security:
    jwt:
      issuer-uri: https://test-auth.local
      jwk-set-uri: http://localhost:18082/.well-known/jwks.json

payment:
  callback:
    shared-secret: test-callback-secret
    signature:
      enabled: false
      secret: test-signature-secret
      max-skew-seconds: 300

outbox:
  publisher:
    enabled: false

kafka:
  consumer:
    booking:
      enabled: false
