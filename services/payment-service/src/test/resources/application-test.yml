spring:
  datasource:
    url: jdbc:h2:mem:payment_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  kafka:
    consumer:
      auto-offset-reset: earliest

app:
  security:
    jwt:
      secret: test-secret-32bytes-minimum-value-12345

payment:
  callback:
    shared-secret: test-callback-secret

outbox:
  publisher:
    enabled: false

kafka:
  consumer:
    booking:
      enabled: false
