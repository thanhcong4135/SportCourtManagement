spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:${PAYMENT_DB_PORT:${MYSQL_PAYMENT_PORT:3307}}/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${kafka.bootstrap-servers}
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed

server:
  port: 8083

app:
  security:
    jwt:
      issuer-uri: ${APP_SECURITY_JWT_ISSUER:https://auth.sportcourt.local}
      jwk-set-uri: ${APP_SECURITY_JWT_JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

payment:
  deposit:
    ratio: 0.5
  callback:
    shared-secret: ${PAYMENT_CALLBACK_SHARED_SECRET:dev-payment-callback-secret}
    signature:
      enabled: ${PAYMENT_CALLBACK_SIGNATURE_ENABLED:false}
      secret: ${PAYMENT_CALLBACK_SIGNATURE_SECRET:}
      max-skew-seconds: ${PAYMENT_CALLBACK_SIGNATURE_MAX_SKEW_SECONDS:300}
  provider:
    type: ${PAYMENT_PROVIDER_TYPE:MOCK}
    mock:
      checkout-base-url: ${PAYMENT_PROVIDER_MOCK_CHECKOUT_BASE_URL:http://localhost:8083/mock-pay}

vnpay:
  enabled: ${VNPAY_ENABLED:true}
  environment: ${VNPAY_ENVIRONMENT:sandbox}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  tmn-code: ${VNPAY_TMN_CODE:DEMOV210}
  hash-secret: ${VNPAY_HASH_SECRET:}
  return-url: ${VNPAY_RETURN_URL:https://making-unclothed-cartridge.ngrok-free.dev/api/payments/vnpay/return}
  ipn-url: ${VNPAY_IPN_URL:https://making-unclothed-cartridge.ngrok-free.dev/api/payments/vnpay/ipn}
  frontend-return-url: ${VNPAY_FRONTEND_RETURN_URL:http://localhost:5173/payment-result}
  version: ${VNPAY_VERSION:2.1.0}
  command: ${VNPAY_COMMAND:pay}
  curr-code: ${VNPAY_CURR_CODE:VND}
  locale: ${VNPAY_LOCALE:vn}
  order-type: ${VNPAY_ORDER_TYPE:other}
  expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}

kafka:
  bootstrap-servers: localhost:9092
  consumer:
    retry:
      max-attempts: 3
      backoff-ms: 1000
    dlq:
      suffix: .dlq
    booking-dlq:
      enabled: true
      group-id: payment-service-booking-dlq
    booking:
      enabled: true
      group-id: payment-service-booking
  dlq:
    replay:
      max-attempts: 5
  topics:
    booking-events: booking.events
    payment-events: payment.events
    booking-events-dlq: booking.events.dlq
    payment-events-dlq: payment.events.dlq

outbox:
  publisher:
    enabled: true
    fixed-delay-ms: 5000
    batch-size: 100
    max-retries: 10
    initial-retry-delay-seconds: 5
    max-retry-delay-seconds: 300
  monitoring:
    failed-threshold: 10
