spring:
  datasource:
    url: jdbc:h2:mem:auth_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

app:
  security:
    jwt:
      issuer: https://test-auth.local
      access-token-ttl-seconds: 3600
      refresh-token-ttl-seconds: 86400
      refresh-token-reuse-revoke-all: true
      signing-key:
        kid: test-rs256-kid
        private-key-location: classpath:keys/test-rs256-private.pem
        public-key-location: classpath:keys/test-rs256-public.pem
      previous-key:
        kid:
        public-key-location:
