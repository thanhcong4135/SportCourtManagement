spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:${AUTH_DB_PORT:3308}/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      issuer: sportcourt-auth
      access-token-ttl-seconds: 3600
      refresh-token-ttl-seconds: 2592000
      refresh-token-reuse-revoke-all: true
      # Dev default only. Replace via env APP_SECURITY_JWT_SECRET in real environments.
      secret: change-this-dev-secret-to-a-long-random-value-32b
