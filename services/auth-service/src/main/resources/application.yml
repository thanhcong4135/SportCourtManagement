spring:
  application:
    name: auth-service
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dev-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
            scope:
              - openid
              - email
              - profile
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
        provider:
          google:
            issuer-uri: https://accounts.google.com
  datasource:
    url: jdbc:mysql://localhost:${AUTH_DB_PORT:3308}/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  oauth2:
    authorized-redirect-uri: ${OAUTH2_AUTHORIZED_REDIRECT_URI:http://localhost:5173/oauth2/redirect}
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:https://auth.sportcourt.local}
      access-token-ttl-seconds: 3600
      refresh-token-ttl-seconds: 2592000
      refresh-token-reuse-revoke-all: true
      signing-key:
        kid: ${APP_SECURITY_JWT_SIGNING_KID:sc-auth-rs256-v1}
        private-key-location: ${APP_SECURITY_JWT_SIGNING_PRIVATE_KEY_LOCATION:classpath:keys/dev-rs256-private.pem}
        public-key-location: ${APP_SECURITY_JWT_SIGNING_PUBLIC_KEY_LOCATION:classpath:keys/dev-rs256-public.pem}
      previous-key:
        kid: ${APP_SECURITY_JWT_PREVIOUS_KID:}
        public-key-location: ${APP_SECURITY_JWT_PREVIOUS_PUBLIC_KEY_LOCATION:}
