spring:
  datasource:
    url: jdbc:h2:mem:core_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  task:
    scheduling:
      enabled: false
  kafka:
    consumer:
      auto-offset-reset: earliest

kafka:
  topics:
    sales-events: sales.events
  consumer:
    payment:
      enabled: false
    payment-dlq:
      enabled: false
    audit:
      enabled: false

app:
  scheduling:
    enabled: false
  pricing:
    default-hourly-rate: 0
  time:
    response-zone: Asia/Ho_Chi_Minh
  security:
    jwt:
      issuer-uri: https://test-auth.local
      jwk-set-uri: http://localhost:18082/.well-known/jwks.json
