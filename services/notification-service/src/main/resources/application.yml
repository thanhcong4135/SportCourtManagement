spring:
  application:
    name: notification-service
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_TIMEOUT_MS:10000}
  datasource:
    url: jdbc:mysql://localhost:${NOTIFICATION_DB_PORT:${MYSQL_NOTIFICATION_PORT:3309}}/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${kafka.bootstrap-servers}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

notification:
  dispatcher:
    fixed-delay-ms: 5000
    batch-size: 100
    max-attempts: 5
    initial-backoff-ms: 5000
    max-backoff-ms: 300000
  delivery:
    mock:
      fail-recipient-pattern: ""
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@sportcourt.vn}
    from-name: ${MAIL_FROM_NAME:SportCourt}
    frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}

kafka:
  bootstrap-servers: localhost:9092
  consumer:
    retry:
      max-attempts: 3
      backoff-ms: 1000
    dlq:
      suffix: .dlq
    booking:
      enabled: true
      group-id: notification-service-booking
    payment:
      enabled: true
      group-id: notification-service-payment
  topics:
    booking-events: booking.events
    payment-events: payment.events

app:
  security:
    jwt:
      issuer-uri: ${APP_SECURITY_JWT_ISSUER:https://auth.sportcourt.local}
      jwk-set-uri: ${APP_SECURITY_JWT_JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
