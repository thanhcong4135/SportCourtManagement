name: backend-ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - core-service
          - auth-service
          - payment-service
          - api-gateway
          - notification-service
          - reporting-service
          - chatbot-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test Compile
        working-directory: services/${{ matrix.service }}
        run: mvn -B -q -Dmaven.repo.local=.m2repo test-compile

  fast-tests:
    runs-on: ubuntu-latest
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core-service
            test: BookingServiceIntegrationTest
          - service: core-service
            test: BookingLifecycleSchedulerTest
          - service: auth-service
            test: AuthServiceIntegrationTest
          - service: payment-service
            test: PaymentServiceIntegrationTest
          - service: api-gateway
            test: GatewaySecurityIntegrationTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Fast Test
        working-directory: services/${{ matrix.service }}
        run: mvn -B -q -Dmaven.repo.local=.m2repo -Dtest=${{ matrix.test }} test
