name: backend-ci

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - core-service
          - auth-service
          - payment-service
          - api-gateway
          - notification-service
          - reporting-service
          - chatbot-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test Compile
        working-directory: services/${{ matrix.service }}
        run: mvn -B -q -Dmaven.repo.local=.m2repo test-compile

  fast-tests:
    runs-on: ubuntu-latest
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core-service
            test: BookingServiceIntegrationTest
          - service: core-service
            test: BookingLifecycleSchedulerTest
          - service: auth-service
            test: AuthServiceIntegrationTest
          - service: payment-service
            test: PaymentServiceIntegrationTest
          - service: api-gateway
            test: GatewaySecurityIntegrationTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Fast Test
        working-directory: services/${{ matrix.service }}
        run: mvn -B -q -Dmaven.repo.local=.m2repo -Dtest=${{ matrix.test }} test

  e2e-gateway-core-payment:
    runs-on: ubuntu-latest
    needs: fast-tests
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and start compose stack
        run: docker compose -f infra/docker/docker-compose.yml up -d --build
      - name: Run gateway-core-payment e2e smoke
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts/e2e-gateway-core-payment.ps1
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color
      - name: Tear down compose stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
