services:
  mysql-core:
    image: mysql:8.4
    container_name: sc-mysql-core
    environment:
      MYSQL_DATABASE: core_db
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "${MYSQL_CORE_PORT:-3306}:3306"
    volumes:
      - mysql_core_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-payment:
    image: mysql:8.4
    container_name: sc-mysql-payment
    environment:
      MYSQL_DATABASE: payment_db
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "${MYSQL_PAYMENT_PORT:-3307}:3306"
    volumes:
      - mysql_payment_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-auth:
    image: mysql:8.4
    container_name: sc-mysql-auth
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "${MYSQL_AUTH_PORT:-3308}:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: sc-redis
    ports:
      - "6379:6379"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: sc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@sc-kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data

  core-service:
    build:
      context: ../../services/core-service
    container_name: sc-core-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-core:3306/core_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      KAFKA_BOOTSTRAP_SERVERS: sc-kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      mysql-core:
        condition: service_healthy

  payment-service:
    build:
      context: ../../services/payment-service
    container_name: sc-payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-payment:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      KAFKA_BOOTSTRAP_SERVERS: sc-kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      mysql-payment:
        condition: service_healthy
      kafka:
        condition: service_started

  auth-service:
    build:
      context: ../../services/auth-service
    container_name: sc-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      APP_SECURITY_JWT_SECRET: change-this-dev-secret-to-a-long-random-value-32b
    ports:
      - "8082:8082"
    depends_on:
      mysql-auth:
        condition: service_healthy

  api-gateway:
    build:
      context: ../../services/api-gateway
    container_name: sc-api-gateway
    environment:
      APP_DOWNSTREAM_AUTH_SERVICE_URL: http://auth-service:8082
      APP_DOWNSTREAM_CORE_SERVICE_URL: http://core-service:8081
      APP_DOWNSTREAM_PAYMENT_SERVICE_URL: http://payment-service:8083
      APP_DOWNSTREAM_NOTIFICATION_SERVICE_URL: http://notification-service:8084
      APP_DOWNSTREAM_REPORTING_SERVICE_URL: http://reporting-service:8085
      APP_DOWNSTREAM_CHATBOT_SERVICE_URL: http://chatbot-service:8086
    ports:
      - "8080:8080"
    depends_on:
      - core-service
      - payment-service
      - notification-service
      - reporting-service
      - chatbot-service

  notification-service:
    build:
      context: ../../services/notification-service
    container_name: sc-notification-service
    ports:
      - "8084:8084"

  reporting-service:
    build:
      context: ../../services/reporting-service
    container_name: sc-reporting-service
    ports:
      - "8085:8085"

  chatbot-service:
    build:
      context: ../../services/chatbot-service
    container_name: sc-chatbot-service
    ports:
      - "8086:8086"

volumes:
  mysql_core_data:
  mysql_payment_data:
  mysql_auth_data:
  kafka_data:
