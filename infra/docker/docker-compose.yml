services:
  mysql-core:
    image: mysql:8.4
    container_name: sc-mysql-core
    environment:
      MYSQL_DATABASE: core_db
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "${MYSQL_CORE_PORT:-3306}:3306"
    volumes:
      - mysql_core_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-payment:
    image: mysql:8.4
    container_name: sc-mysql-payment
    environment:
      MYSQL_DATABASE: payment_db
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "${MYSQL_PAYMENT_PORT:-3307}:3306"
    volumes:
      - mysql_payment_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-auth:
    image: mysql:8.4
    container_name: sc-mysql-auth
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "${MYSQL_AUTH_PORT:-3308}:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-notification:
    image: mysql:8.4
    container_name: sc-mysql-notification
    environment:
      MYSQL_DATABASE: notification_db
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "${MYSQL_NOTIFICATION_PORT:-3309}:3306"
    volumes:
      - mysql_notification_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-reporting:
    image: mysql:8.4
    container_name: sc-mysql-reporting
    environment:
      MYSQL_DATABASE: reporting_db
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "${MYSQL_REPORTING_PORT:-3310}:3306"
    volumes:
      - mysql_reporting_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: sc-redis
    ports:
      - "6379:6379"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: sc-kafka
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://sc-kafka:9092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@sc-kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data

  core-service:
    build:
      context: ../../services/core-service
    container_name: sc-core-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-core:3306/core_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      KAFKA_BOOTSTRAP_SERVERS: sc-kafka:9092
      APP_SECURITY_JWT_ISSUER: https://auth.sportcourt.local
      APP_SECURITY_JWT_JWK_SET_URI: http://auth-service:8082/.well-known/jwks.json
    ports:
      - "8081:8081"
    depends_on:
      mysql-core:
        condition: service_healthy

  payment-service:
    build:
      context: ../../services/payment-service
    container_name: sc-payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-payment:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      KAFKA_BOOTSTRAP_SERVERS: sc-kafka:9092
      APP_SECURITY_JWT_ISSUER: https://auth.sportcourt.local
      APP_SECURITY_JWT_JWK_SET_URI: http://auth-service:8082/.well-known/jwks.json
      VNPAY_ENABLED: ${VNPAY_ENABLED:-true}
      VNPAY_ENVIRONMENT: ${VNPAY_ENVIRONMENT:-sandbox}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-7FXP85ML}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:?VNPAY_HASH_SECRET must be set for VNPAY sandbox payments}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:?VNPAY_RETURN_URL must be set for VNPAY sandbox payments}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:?VNPAY_IPN_URL must be set for VNPAY sandbox payments}
      VNPAY_FRONTEND_RETURN_URL: ${VNPAY_FRONTEND_RETURN_URL:-http://localhost:5173/payment-result}
    ports:
      - "8083:8083"
    depends_on:
      mysql-payment:
        condition: service_healthy
      kafka:
        condition: service_started

  auth-service:
    build:
      context: ../../services/auth-service
    container_name: sc-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      APP_SECURITY_JWT_ISSUER: https://auth.sportcourt.local
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dev-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dev-google-client-secret}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}
      OAUTH2_AUTHORIZED_REDIRECT_URI: ${OAUTH2_AUTHORIZED_REDIRECT_URI:-http://localhost:5173/oauth2/redirect}
    ports:
      - "8082:8082"
    depends_on:
      mysql-auth:
        condition: service_healthy

  api-gateway:
    build:
      context: ../../services/api-gateway
    container_name: sc-api-gateway
    environment:
      APP_DOWNSTREAM_AUTH_SERVICE_URL: http://auth-service:8082
      APP_DOWNSTREAM_CORE_SERVICE_URL: http://core-service:8081
      APP_DOWNSTREAM_PAYMENT_SERVICE_URL: http://payment-service:8083
      APP_DOWNSTREAM_NOTIFICATION_SERVICE_URL: http://notification-service:8084
      APP_DOWNSTREAM_REPORTING_SERVICE_URL: http://reporting-service:8085
      APP_DOWNSTREAM_CHATBOT_SERVICE_URL: http://chatbot-service:8086
      APP_SECURITY_JWT_ISSUER: https://auth.sportcourt.local
      APP_SECURITY_JWT_JWK_SET_URI: http://auth-service:8082/.well-known/jwks.json
    ports:
      - "8080:8080"
    depends_on:
      - core-service
      - payment-service
      - notification-service
      - reporting-service
      - chatbot-service

  notification-service:
    build:
      context: ../../services/notification-service
    container_name: sc-notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-notification:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      KAFKA_BOOTSTRAP_SERVERS: sc-kafka:9092
    ports:
      - "8084:8084"
    depends_on:
      mysql-notification:
        condition: service_healthy
      kafka:
        condition: service_started

  reporting-service:
    build:
      context: ../../services/reporting-service
    container_name: sc-reporting-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-reporting:3306/reporting_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      KAFKA_BOOTSTRAP_SERVERS: sc-kafka:9092
    ports:
      - "8085:8085"
    depends_on:
      mysql-reporting:
        condition: service_healthy
      kafka:
        condition: service_started

  chatbot-service:
    build:
      context: ../../services/chatbot-service
    container_name: sc-chatbot-service
    ports:
      - "8086:8086"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sc-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api-gateway
      - auth-service
      - core-service
      - payment-service
      - notification-service
      - reporting-service
      - chatbot-service

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: sc-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    container_name: sc-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql_core_data:
  mysql_payment_data:
  mysql_auth_data:
  mysql_notification_data:
  mysql_reporting_data:
  kafka_data:
  prometheus_data:
  grafana_data:
