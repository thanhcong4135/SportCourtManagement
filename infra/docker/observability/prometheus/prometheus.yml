global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8082"]

  - job_name: core-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["core-service:8081"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8083"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8084"]

  - job_name: reporting-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["reporting-service:8085"]

  - job_name: chatbot-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["chatbot-service:8086"]